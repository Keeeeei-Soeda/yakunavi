# Nginx設定ファイル: /etc/nginx/sites-available/yaku-navi
# ドメイン: yaku-navi.com（静的LPのみ）
# 旧サブドメイン yakkyoku / yakuzaishi は本体へリダイレクト

# HTTP → HTTPS
server {
    listen 80;
    server_name yaku-navi.com www.yaku-navi.com;
    return 301 https://$host$request_uri;
}

# 旧サブドメイン（HTTP）→ 本体
server {
    listen 80;
    server_name yakkyoku.yaku-navi.com yakuzaishi.yaku-navi.com;
    return 301 https://yaku-navi.com$request_uri;
}

# 本番トップ（静的HTML）
server {
    listen 443 ssl http2;
    server_name yaku-navi.com www.yaku-navi.com;

    ssl_certificate /etc/letsencrypt/live/yaku-navi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yaku-navi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/yaku-navi-access.log;
    error_log /var/log/nginx/yaku-navi-error.log;

    root /var/www/yaku-navi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# 旧サブドメイン（HTTPS）→ 本体
server {
    listen 443 ssl http2;
    server_name yakkyoku.yaku-navi.com;

    ssl_certificate /etc/letsencrypt/live/yakkyoku.yaku-navi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yakkyoku.yaku-navi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://yaku-navi.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yakuzaishi.yaku-navi.com;

    ssl_certificate /etc/letsencrypt/live/yakuzaishi.yaku-navi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yakuzaishi.yaku-navi.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://yaku-navi.com$request_uri;
}
